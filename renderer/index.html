  if (root === $('#detail')) return $('#dActions button') || [...$('#detail').querySelectorAll(NAV_SEL)].find(shown);
  return $('#view .card') || $('#view .tile') || $('#heroGo') || [...$('#view').querySelectorAll(NAV_SEL)].find(shown) || document.querySelector('#nav button.on');
}
function navMove(dir) {
  enterNavMode();
  const root = navRoot();
  const cur = document.activeElement;
  if (!cur || cur === document.body || !root.contains(cur) || !shown(cur)) return focusEl(defaultFocus());
  const a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, bs = Infinity;
  const region = e => e.closest('#side') ? 'side' : e.closest('#ab') ? 'player' : 'main';
  const curRegion = region(cur);
  for (const e of navCandidates()) {
    if (e === cur) continue;
    if ((dir === 'up' || dir === 'down') && region(e) !== curRegion && !(curRegion === 'player' && dir === 'up') && !(region(e) === 'player' && dir === 'down' && curRegion === 'main')) continue;
    const b = e.getBoundingClientRect(), bx = b.left + b.width / 2, by = b.top + b.height / 2;
    let main, ortho;
    if (dir === 'right') { if (bx <= ax + 2 || b.left < a.left + 4) continue; main = Math.max(0, b.left - a.right); ortho = Math.max(0, b.top - a.bottom, a.top - b.bottom); }
    else if (dir === 'left') { if (bx >= ax - 2 || b.right > a.right - 4) continue; main = Math.max(0, a.left - b.right); ortho = Math.max(0, b.top - a.bottom, a.top - b.bottom); }
    else if (dir === 'down') { if (by <= ay + 2 || b.top < a.top + 4) continue; main = Math.max(0, b.top - a.bottom); ortho = Math.max(0, b.left - a.right, a.left - b.right); }
    else { if (by >= ay - 2 || b.bottom > a.bottom - 4) continue; main = Math.max(0, a.top - b.bottom); ortho = Math.max(0, b.left - a.right, a.left - b.right); }
    const score = main + ortho * 4 + Math.hypot(bx - ax, by - ay) * 0.05;
    if (score < bs) { bs = score; best = e; }
  }
  if (best && curRegion === 'main' && region(best) === 'side') best = document.querySelector('#nav button.on, #nav2 button.on') || best;
  if (best && curRegion === 'side' && region(best) === 'main' && (dir === 'right')) best = $('#view .card') || best;
  if (best) focusEl(best);
}
function navActivate() {
  const e = document.activeElement;
  if (!e || e === document.body) return focusEl(defaultFocus());
  if (e.tagName === 'SELECT') { e.selectedIndex = (e.selectedIndex + 1) % e.options.length; e.dispatchEvent(new Event('change', { bubbles: true })); return; }
  if (e.tagName === 'INPUT' && e.type !== 'range') { if (nav.couch || e.id === 'q') openOsk(e); return; }
  e.click();
}
function navBack() {
  if (nav.osk) return closeOsk();
  if ($('#tmenu').classList.contains('on')) { $('#tmenu').classList.remove('on'); return focusEl(document.querySelector('.tile')); }
  if ($('#detail').classList.contains('on')) {
    closeDetail();
    const lf = nav.lastFocus; if (lf && document.contains(lf) && shown(lf)) focusEl(lf); else focusEl(defaultFocus());
    return;
  }
  if (ui.q) { ui.q = ''; $('#q').value = ''; render(); return; }
  if (ui.view === 'games' && ui.gamesView && !$('#side').contains(document.activeElement)) return $('#gBack').click();
  if (!$('#side').contains(document.activeElement)) return focusEl(document.querySelector(`#nav button[data-v="${ui.view}"], #nav2 button[data-v="${ui.view}"]`) || document.querySelector('#nav button'));
  if (ui.view !== 'home') go('home');
}
function navCycle(step) {
  const views = ['home', ...CATS.filter(c => cfg.categories[c.id] && cfg.categories[c.id].enabled).map(c => c.id)];
  const i = views.indexOf(ui.view);
  go(views[(i < 0 ? 0 : i + step + views.length) % views.length]);
  setTimeout(() => focusEl(defaultFocus()), 30);
}
function navScroll(dir) {
  const box = $('#detail').classList.contains('on') ? $('#sheet') : $('#view');
  box.scrollBy({ top: dir * box.clientHeight * 0.8, behavior: 'smooth' });
  setTimeout(() => {
    const r = box.getBoundingClientRect();
    const inView = navCandidates().filter(e => box.contains(e)).find(e => { const b = e.getBoundingClientRect(); return b.top >= r.top && b.bottom <= r.bottom; });
    if (inView) inView.focus({ preventScroll: true });
  }, 350);
}
function navPlay() {
  const ft = document.activeElement && document.activeElement.closest && document.activeElement.closest('.tile');
  if (ft) { const r = ft.getBoundingClientRect(); return tileMenu(ft.dataset.col, r.left + 20, r.top + 20); }
  if ($('#ab').classList.contains('on') && !$('#detail').classList.contains('on')) return audio.paused ? audio.play() : audio.pause();
  const p = ($('#detail').classList.contains('on') ? $('#dActions .btn.primary') : null);
  if (p) return p.click();
  const c = document.activeElement && document.activeElement.closest && document.activeElement.closest('.card');
  if (c) c.click();
}
function enterNavMode() { if (!nav.mode) { nav.mode = true; document.body.classList.add('navmode'); } }
function exitNavMode() { if (nav.mode) { nav.mode = false; document.body.classList.remove('navmode'); } }
async function setCouch(on) {
  nav.couch = on;
  document.body.classList.toggle('couch', on);
  window.api.setZoom(on ? ((cfg.couch && cfg.couch.scale) || 1.25) : 1);
  window.api.setFullScreen(on);
  if (on) { enterNavMode(); setTimeout(() => focusEl(defaultFocus()), 150); }
}
// --- on-screen keyboard (for search with a controller) ---
const OSK_ROWS = ['1234567890', 'qwertyuiop', "asdfghjkl'", 'zxcvbnm-.&'];
function openOsk(input) {
  nav.osk = input;
  $('#oskVal').textContent = input.value;
  $('#oskRows').innerHTML = OSK_ROWS.map(r => `<div class="r">${[...r].map(ch => `<button class="k" data-ch="${esc(ch)}">${esc(ch)}</button>`).join('')}</div>`).join('') +
    `<div class="r"><button class="k w" data-op="space">Space</button><button class="k w" data-op="bksp">⌫ Delete</button><button class="k w" data-op="clear">Clear</button><button class="k w" data-op="done">Done</button></div>`;
  $('#osk').classList.add('on');
  $('#oskRows').querySelectorAll('button').forEach(b => b.onclick = () => {
    let v = input.value;
    if (b.dataset.ch) v += b.dataset.ch; else if (b.dataset.op === 'space') v += ' '; else if (b.dataset.op === 'bksp') v = v.slice(0, -1); else if (b.dataset.op === 'clear') v = ''; else return closeOsk();
    input.value = v; $('#oskVal').textContent = v; input.dispatchEvent(new Event('input', { bubbles: true }));
  });
  enterNavMode();
  focusEl($('#oskRows button[data-ch="a"]'));
}
function closeOsk() {
  const input = nav.osk; nav.osk = null; $('#osk').classList.remove('on');
  setTimeout(() => focusEl($('#view .card') || input), 250);
}
// --- gamepad polling ---
const BTN = { a: 0, b: 1, x: 2, y: 3, lb: 4, rb: 5, lt: 6, rt: 7, view: 8, start: 9, up: 12, down: 13, left: 14, right: 15 };
const REPEAT = new Set(['up', 'down', 'left', 'right', 'lt', 'rt']);
function padState() {
  const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(p => p && p.connected) : [];
  if (!pads.length) return null;
  const st = {};
  for (const [k, i] of Object.entries(BTN)) st[k] = pads.some(p => p.buttons[i] && (p.buttons[i].pressed || p.buttons[i].value > 0.5));
  for (const p of pads) {
    const x = p.axes[0] || 0, y = p.axes[1] || 0;
    if (Math.abs(x) > 0.55 && Math.abs(x) > Math.abs(y)) st[x > 0 ? 'right' : 'left'] = true;
    if (Math.abs(y) > 0.55 && Math.abs(y) >= Math.abs(x)) st[y > 0 ? 'down' : 'up'] = true;
  }
  return st;
}
function padAction(k) {
  if (!nav.mode) enterNavMode();
  if (!nav.couch && !nav.autoDone && cfg.couch && cfg.couch.autoOnController) { nav.autoDone = true; setCouch(true); if (k !== 'start') return; }
  if (k === 'start') { nav.autoDone = true; return setCouch(!nav.couch); }
  if (nav.osk && k === 'x') return $('#oskRows [data-op=bksp]').click();
  if (nav.osk && k === 'y') return $('#oskRows [data-op=space]').click();
  ({ up: () => navMove('up'), down: () => navMove('down'), left: () => navMove('left'), right: () => navMove('right'),
     a: navActivate, b: navBack, x: navPlay, y: () => openOsk($('#q')), lb: () => navCycle(-1), rb: () => navCycle(1),
     lt: () => navScroll(-1), rt: () => navScroll(1), view: () => { go('setup'); setTimeout(() => focusEl(defaultFocus()), 30); } }[k] || (() => {}))();
}
function pollPads() {
  requestAnimationFrame(pollPads);
  const st = document.hasFocus() ? padState() : null; // ignore the pad while a game/player window has focus
  const now = performance.now();
  if (!st) { nav.held = {}; return; }
  for (const k of Object.keys(BTN)) {
    const h = nav.held[k];
    if (st[k] && !h) { nav.held[k] = { t: now, next: now + 380 }; padAction(k); }
    else if (st[k] && h && REPEAT.has(k) && now >= h.next) { h.next = now + (k === 'lt' || k === 'rt' ? 300 : 110); padAction(k); }
    else if (!st[k] && h) delete nav.held[k];
  }
}
requestAnimationFrame(pollPads);
window.addEventListener('gamepadconnected', e => {
  toast(`Controller connected${cfg && cfg.couch && cfg.couch.autoOnController && !nav.couch ? ' — press any button for couch mode' : ' — press Start/☰ for couch mode'}`, 'ok');
});
// keyboard: arrows navigate, F10 toggles couch mode
document.addEventListener('keydown', e => {
  if (nav.osk && !['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'Escape'].includes(e.key)) { closeOsk(); return; }
  if (e.key === 'F10') { e.preventDefault(); return setCouch(!nav.couch); }
  const t = document.activeElement, typing = t && (t.tagName === 'INPUT' && t.type !== 'checkbox' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA');
  const dirs = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
  if (dirs[e.key] && (!typing || nav.osk)) { e.preventDefault(); return navMove(dirs[e.key]); }
  if (e.key === 'Enter' && t && (t.matches('label.tog, .frow[data-tr], .tile') || nav.osk)) { e.preventDefault(); t.click(); }
  if (e.key === 'Escape' && nav.osk) { e.stopImmediatePropagation(); closeOsk(); }
}, true);
document.addEventListener('mousemove', () => { if (nav.mode && !nav.couch) exitNavMode(); });
document.addEventListener('mousedown', () => { if (nav.mode && !nav.couch) exitNavMode(); });
// keep focus sensible across re-renders and detail sheets
const _render = render;
render = function () { _render(); if (nav.mode && !nav.osk) { const a = document.activeElement; if (!a || a === document.body || !document.contains(a) || !shown(a)) focusEl(defaultFocus()); } };
const _openDetail = openDetail;
openDetail = async function (cat, id) { nav.lastFocus = document.activeElement; await _openDetail(cat, id); if (nav.mode) setTimeout(() => focusEl(defaultFocus()), 20); };

/* ============================== boot ============================== */
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape') { if ($('#detail').classList.contains('on')) closeDetail(); else if (ui.q) { ui.q = ''; $('#q').value = ''; render(); } }
  if (e.key === ' ' && $('#ab').classList.contains('on') && !/INPUT|SELECT|BUTTON/.test(document.activeElement.tagName)) { e.preventDefault(); audio.paused ? audio.play() : audio.pause(); }
});
let qT;
$('#q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { ui.q = e.target.value.trim(); closeDetail(); render(); $('#view').scrollTop = 0; }, 160); });
$('#detail').addEventListener('click', e => { if (e.target.id === 'detail') closeDetail(); });

async function boot() {
  [cfg, lib, ust, catalog, emuSys, tileArt] = await Promise.all([window.api.getConfig(), window.api.getLibrary(), window.api.getState(), window.api.catalog(), window.api.emuSystems ? window.api.emuSystems() : [], window.api.tilesList ? window.api.tilesList() : {}]);
  if (!cfg.setupDone) { ui.view = 'setup'; ui.setupTab = 'general'; }
  if (window.api.updateInfo) window.api.updateInfo().then(u => { updState = u; paintUpdates(); }).catch(() => {});
  if (window.api.tilesBundled) { try { BUNDLED_TILES = { ...BUNDLED_TILES, ...(await window.api.tilesBundled()) }; } catch {} }
  if (cfg.setupDone && cfg.couch && cfg.couch.startInCouch) setCouch(true);
  if (lib.updated) $('#scanStatus').textContent = 'Last scan ' + new Date(lib.updated).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  render();
  if (cfg.setupDone && Date.now() - (lib.updated || 0) > 6 * 3.6e6) rescan();
}
if (window.api) boot();
else { const s = document.createElement('script'); s.src = '../test/mock-api.js'; s.onload = () => { window.api.onProgress(() => {}); boot(); }; document.head.appendChild(s); }
</script>
