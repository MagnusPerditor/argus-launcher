<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * file: data: blob:; media-src * file: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src *">
<title>Argus Launcher</title>
<style>
:root{
  --bg:#0b0d12; --bg2:#11141b; --panel:#161a23; --panel2:#1c2130; --line:#262c3b; --text:#e9ecf3; --dim:#8b93a7; --faint:#5b6377;
  --accent:#f5b642; --ok:#3ecf8e; --bad:#ff6b6b; --radius:12px;
  --c-movies:#f5b642; --c-tv:#4aa8ff; --c-musicvideos:#ff5fa2; --c-books:#3ecf8e; --c-music:#2dd4bf; --c-audiobooks:#a78bfa; --c-games:#b6f24a; --c-home:#f5b642; --c-setup:#9aa3b8;
  font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2a3142;border-radius:10px;border:2px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}

#app{display:grid;grid-template-columns:232px 1fr;grid-template-rows:100%;height:100vh}
#side,#main{min-height:0}
/* ---------- sidebar ---------- */
#side{background:linear-gradient(180deg,#0e1118,#0a0c11);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;font-family:"Segoe UI Variable Display","Segoe UI",system-ui;font-weight:700;font-size:19px;letter-spacing:.2px}
.brand .logo{width:32px;height:32px;border-radius:9px;background:url(logo.png) center/cover}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;padding:10px 12px;border-radius:10px;color:var(--dim);text-align:left;font-size:14.5px;position:relative}
.nav button svg{width:20px;height:20px;flex:none}
.nav button .n{margin-left:auto;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.nav button:hover{background:#151925;color:var(--text)}
.nav button.on{background:#171c29;color:var(--text)}
.nav button.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--cc)}
.nav button.on svg{color:var(--cc)}
.side-sep{height:1px;background:var(--line);margin:14px 6px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
#scanStatus{font-size:12px;color:var(--dim);padding:8px 12px 0;min-height:30px;line-height:1.35}
#scanStatus .bar{height:3px;background:#222838;border-radius:3px;margin-top:6px;overflow:hidden}
#scanStatus .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

/* ---------- main ---------- */
#main{display:flex;flex-direction:column;min-width:0;position:relative}
#top{display:flex;align-items:center;gap:14px;padding:14px 28px;border-bottom:1px solid transparent;position:relative;z-index:5}
#search{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 16px}
#search input{flex:1;background:none;border:0;outline:none;font-size:14px}
#search kbd{font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
#view{flex:1;overflow:auto;padding:4px 28px 120px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);padding:9px 16px;border-radius:10px;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--cc,var(--accent));border-color:transparent;color:#10131a;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:none}
.btn svg{width:17px;height:17px}
.btn:disabled{opacity:.45;cursor:default}

h1.cat{font-family:"Segoe UI Variable Display","Segoe UI",system-ui;font-size:30px;margin:14px 0 4px;font-weight:700;letter-spacing:-.3px}
.sub{color:var(--dim);font-size:13.5px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:18px 0 18px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 13px;font-size:13px;color:var(--dim)}
.chip:hover{color:var(--text)}
.chip.on{background:var(--text);color:#0b0d12;border-color:var(--text);font-weight:600}
.toolbar .sp{flex:1}
select.sel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}

/* service strip */
.services{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.svc{display:flex;align-items:center;gap:9px;padding:8px 14px 8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:13.5px;font-weight:600}
.svc:hover{border-color:var(--sc)}
.svc .dot{width:22px;height:22px;border-radius:6px;background:var(--sc);display:grid;place-items:center;font-size:11px;font-weight:800;color:#0b0d12}
.svc.big{padding:11px 18px 11px 12px;font-size:14.5px}
.svc.big .dot{width:26px;height:26px}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw,158px),1fr));gap:22px 16px}
.grid.wide{--cw:250px}.grid.square{--cw:170px}
.card{cursor:pointer;min-width:0;outline:none}
.card .art{position:relative;aspect-ratio:2/3;border-radius:var(--radius);overflow:hidden;background:var(--panel);box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -18px #000;transition:transform .18s ease,box-shadow .18s}
.grid.wide .card .art,.row.wide .card .art{aspect-ratio:16/9}
.grid.square .card .art,.row.square .card .art{aspect-ratio:1}
.card:hover .art,.card:focus .art{transform:translateY(-4px);box-shadow:0 0 0 2px var(--cc,var(--accent)),0 18px 40px -16px #000}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card img.logo{object-fit:contain;padding:22%;background:radial-gradient(circle at 50% 40%,#232a3a,#141822)}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;background:linear-gradient(160deg,color-mix(in srgb,var(--cc) 30%,#1a1f2c),#10131b 75%)}
.ph b{font-family:"Segoe UI Variable Display","Segoe UI",system-ui;font-size:17px;line-height:1.15;word-break:break-word}
.ph span{font-size:12px;color:var(--dim);margin-top:4px}
.badges{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:3px 7px;border-radius:6px;background:rgba(10,12,18,.82);backdrop-filter:blur(6px);color:#dfe4ee;text-transform:uppercase}
.badge.tb{color:#7fe3c2}.badge.cloud{color:#9fd0ff}.badge.gp{color:#b6f24a}.badge.ps{color:#7fa8ff}
.card .t{margin-top:9px;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .m{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.badge.w{color:#3ecf8e}
.ep .still{position:relative}
.ep .eprog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.55)}.ep .eprog i{display:block;height:100%;background:var(--c-tv)}
.ep .wk{position:absolute;right:6px;top:6px;background:rgba(10,12,18,.85);color:#3ecf8e;border-radius:6px;font-size:11px;font-weight:800;padding:2px 6px}
.ep.done .et{color:var(--dim)}
.wline{font-size:13px;color:var(--dim);margin-top:10px}.wline b{color:var(--text)}
.card .prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.5)}.card .prog i{display:block;height:100%;background:var(--cc)}

/* home */
.hero{position:relative;margin:4px 0 30px;border-radius:18px;overflow:hidden;min-height:340px;display:flex;align-items:flex-end;background:#121621}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,13,18,.96) 0%,rgba(11,13,18,.6) 45%,rgba(11,13,18,.05) 100%),linear-gradient(0deg,rgba(11,13,18,.9),transparent 50%)}
.hero .in{position:relative;z-index:1;padding:34px 38px;max-width:620px}
.hero .kick{font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--cc)}
.hero h2{font-family:"Segoe UI Variable Display","Segoe UI",system-ui;font-size:40px;margin:8px 0 10px;line-height:1.05;letter-spacing:-.5px}
.hero p{color:#c6ccda;line-height:1.55;font-size:14.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rowhead{display:flex;align-items:baseline;gap:12px;margin:26px 0 12px}
.rowhead h3{margin:0;font-size:18px;font-family:"Segoe UI Variable Display","Segoe UI",system-ui}
.rowhead button{background:none;border:0;color:var(--dim);font-size:13px}
.rowhead button:hover{color:var(--text)}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:16px;overflow-x:auto;padding:4px 2px 14px}
.row.wide{grid-auto-columns:250px}.row.square{grid-auto-columns:160px}
.empty{border:1px dashed var(--line);border-radius:16px;padding:46px;text-align:center;color:var(--dim);line-height:1.6}
.empty b{color:var(--text);font-size:17px;display:block;margin-bottom:6px}

/* detail */
#detail{position:absolute;inset:0;z-index:20;background:rgba(5,6,9,.6);backdrop-filter:blur(3px);display:none}
#detail.on{display:block}
#detail .sheet{position:absolute;inset:18px 18px 18px 18px;background:var(--bg2);border:1px solid var(--line);border-radius:18px;overflow:auto}
#detail .bd{position:relative;height:360px;background:#121621}
#detail .bd img{width:100%;height:100%;object-fit:cover;opacity:.55}
#detail .bd::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg2) 3%,rgba(17,20,27,.25) 60%,rgba(17,20,27,.5))}
#detail .x{position:absolute;right:16px;top:16px;z-index:3;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(11,13,18,.7);display:grid;place-items:center}
.dwrap{display:grid;grid-template-columns:230px 1fr;gap:34px;padding:0 40px 40px;margin-top:-210px;position:relative;z-index:2}
.dwrap .poster{border-radius:14px;overflow:hidden;aspect-ratio:2/3;background:var(--panel);box-shadow:0 30px 60px -25px #000}
.dwrap .poster.sq{aspect-ratio:1}.dwrap .poster.wd{aspect-ratio:16/9}
.dwrap .poster img{width:100%;height:100%;object-fit:cover}
.dwrap .poster img.logo{object-fit:contain;padding:20%}
.dtitle{font-family:"Segoe UI Variable Display","Segoe UI",system-ui;font-size:38px;font-weight:700;margin:96px 0 8px;letter-spacing:-.5px;line-height:1.05}
.facts{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--dim);font-size:13.5px;align-items:center}
.facts .rate{color:var(--accent);font-weight:700}
.overview{max-width:780px;line-height:1.65;color:#cdd3df;font-size:14.5px;margin:16px 0 0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 8px}
.sect{margin-top:28px}
.sect h4{margin:0 0 12px;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim)}
.filelist{display:flex;flex-direction:column;gap:6px;max-width:860px}
.frow{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px}
.frow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
.frow .src{font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:#232a3a}
.frow .src.tb{color:#7fe3c2}
.seasons{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.eps{display:flex;flex-direction:column;gap:8px;max-width:980px}
.ep{display:grid;grid-template-columns:160px 1fr auto;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.ep.miss{opacity:.5}
.ep .still{aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#20263a;display:grid;place-items:center;color:var(--faint);font-weight:700}
.ep .still img{width:100%;height:100%;object-fit:cover}
.ep .et{font-weight:600;font-size:14px}.ep .eo{font-size:12.5px;color:var(--dim);margin-top:4px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep .eb{display:flex;gap:6px;flex-direction:column;align-items:stretch}
.provs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.provs img{width:34px;height:34px;border-radius:8px}
.note{font-size:12.5px;color:var(--dim);line-height:1.5}

/* setup */
.setup{max-width:1020px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 22px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 16px;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14px;white-space:nowrap}
.tabs button.on{color:var(--text);border-color:var(--tc,var(--accent))}
.card2{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px}
.card2 h3{margin:0 0 4px;font-size:16px}
.card2 > .sub{margin-bottom:14px}
.field{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:center;padding:9px 0}
.field label{color:var(--dim);font-size:13.5px}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13.5px;outline:none}
.inp:focus{border-color:var(--accent)}
.inline{display:flex;gap:8px;align-items:center}
.folders{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.folder{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-family:Consolas,ui-monospace,monospace}
.folder span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder button{background:none;border:0;color:var(--faint);font-size:17px;line-height:1}
.folder button:hover{color:var(--bad)}
.svcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px}
.svct{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg);font-size:13.5px;text-align:left}
.svct .dot{width:20px;height:20px;border-radius:5px;background:var(--sc);flex:none}
.svct .ck{margin-left:auto;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--faint);display:grid;place-items:center}
.svct.on{border-color:var(--sc);background:color-mix(in srgb,var(--sc) 9%,var(--bg))}
.svct.on .ck{background:var(--sc);border-color:var(--sc)}
.svct.on .ck::after{content:"";width:8px;height:5px;border:2px solid #0b0d12;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.tog{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:14px;cursor:pointer}
.tog input{display:none}
.tog .sw{width:38px;height:22px;border-radius:999px;background:#2a3142;position:relative;flex:none;transition:background .15s}
.tog .sw::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#cfd5e2;transition:transform .15s}
.tog input:checked + .sw{background:var(--tc,var(--accent))}
.tog input:checked + .sw::after{transform:translateX(16px);background:#0b0d12}
.tog small{color:var(--dim);display:block;font-size:12.5px;margin-top:2px}
.tog.dis{opacity:.5;pointer-events:none}
.subgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
.savebar{position:sticky;bottom:-4px;z-index:4;display:flex;gap:10px;justify-content:flex-end;padding:16px 0;background:linear-gradient(0deg,var(--bg) 60%,transparent)}
.welcome{background:linear-gradient(120deg,#1b2030,#141823);border:1px solid var(--line);border-radius:16px;padding:22px 26px;margin-top:16px;line-height:1.6;color:#c6ccda}
.welcome b{color:var(--text);font-size:18px}
.keyok{font-size:12.5px;margin-left:8px}
.keyok.ok{color:var(--ok)}.keyok.bad{color:var(--bad)}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#232a3a;color:var(--dim);margin-left:6px;vertical-align:middle}

/* audiobook player */
#ab{position:absolute;left:16px;right:16px;bottom:14px;z-index:15;background:rgba(22,26,35,.94);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;display:none;align-items:center;gap:16px;padding:10px 16px 10px 10px;box-shadow:0 20px 50px -20px #000}
#ab.on{display:flex}
#ab #abShuf{display:none}
#ab.music #abShuf{display:grid}
#ab.music #abBack,#ab.music #abFwd,#ab.music #abRate{display:none}
#ab #abShuf.on{color:var(--pc);background:#262c3b}
#ab input[type=range]{accent-color:var(--pc,var(--c-audiobooks))}
.frow.now{border-color:var(--cc)}.frow.now .nm{color:var(--text)}
#main.abon .savebar{bottom:86px}
#ab img{width:54px;height:54px;border-radius:9px;object-fit:cover;background:var(--panel2)}
#ab .info{width:230px;min-width:0}
#ab .info b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ab .info span{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#ab .ctl{display:flex;gap:6px;align-items:center}
#ab .ctl button{background:none;border:0;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
#ab .ctl button:hover{background:#262c3b}
#ab .ctl button.pp{background:var(--pc,var(--c-audiobooks));color:#0b0d12;width:42px;height:42px}
#ab .ctl svg{width:20px;height:20px}
#ab .seek{flex:1;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
#ab input[type=range]{flex:1;accent-color:var(--pc,var(--c-audiobooks))}
#ab select{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-size:12px}

/* ---------- games landing ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.tile{position:relative;aspect-ratio:16/10;border-radius:16px;overflow:hidden;border:0;padding:0;text-align:left;background:linear-gradient(140deg,color-mix(in srgb,var(--tc) 55%,#141822),#0e1118 85%);box-shadow:0 14px 34px -20px #000;transition:transform .18s,box-shadow .18s;color:#fff}
.tile:hover,.tile:focus{transform:translateY(-4px);box-shadow:0 0 0 3px var(--tc),0 22px 44px -18px #000;outline:none}
.tile .mosaic{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;opacity:.55;transform:rotate(-8deg) scale(1.35) translate(8%,-6%)}
.tile .mosaic img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:6px;display:block}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,color-mix(in srgb,var(--tc) 35%,#0b0d12) 0%,rgba(11,13,18,.55) 45%,rgba(11,13,18,.1) 100%)}
.tile .glyph{position:absolute;right:-10px;top:-14px;width:150px;height:150px;opacity:.13;color:#fff}
.tile .lbl{position:absolute;left:18px;right:18px;bottom:16px;z-index:2}
.tile .lbl b{display:block;font-family:"Segoe UI Variable Display","Segoe UI",system-ui;font-size:23px;letter-spacing:-.2px;line-height:1.1;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.tile .lbl span{display:block;font-size:12.5px;color:#d5dae6;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .cnt{position:absolute;right:14px;top:14px;z-index:2;background:rgba(10,12,18,.75);backdrop-filter:blur(6px);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:700}
.tile.sm{aspect-ratio:16/9}
.tile{cursor:pointer}
.tiles.sq{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.tiles.sq .tile{aspect-ratio:1}
.tiles.sq .tile .mosaic{grid-template-columns:repeat(3,1fr)}
.tile .tart{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;transform:scale(1.1) translateY(-4%);transition:transform .25s}
.tile:hover .tart,.tile:focus .tart{transform:scale(1.15) translateY(-4%)}
.tile.retro .tart{transform:scale(1.32) translateY(-7%)}
.tile.retro:hover .tart,.tile.retro:focus .tart{transform:scale(1.38) translateY(-7%)}
.tile.hasart .lbl{left:16px;bottom:12px}
.tile.hasart .lbl b{font-size:17px}
.tile.hasart .lbl span{font-size:11.5px;color:#aeb5c4}
.tile.hasart::after{background:linear-gradient(0deg,rgba(8,10,14,.9) 0%,rgba(8,10,14,.35) 22%,rgba(8,10,14,0) 40%);z-index:1}
.tile.hasart .glyph{display:none}
.tile .cnt{z-index:3}
#tmenu{position:fixed;z-index:70;display:none;flex-direction:column;min-width:200px;background:#1b2030;border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 18px 40px -14px #000}
#tmenu.on{display:flex}
#tmenu button{background:none;border:0;text-align:left;padding:9px 12px;border-radius:7px;font-size:13.5px}
#tmenu button:hover,#tmenu button:focus{background:#262c3b;outline:none}
.crumb{display:flex;align-items:center;gap:12px;margin:14px 0 4px}
.crumb .back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:18px}
.crumb .back:hover{background:var(--panel2)}
.crumb h1.cat{margin:0}
.crumb .dotc{width:14px;height:14px;border-radius:4px;background:var(--tc)}
.sectlabel{margin:30px 0 14px;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim)}
/* ---------- controller / couch mode ---------- */
body.navmode *:focus{outline:none}
body.navmode :is(button,select,input,label.tog,a,.frow):focus{outline:3px solid var(--fc,#fff);outline-offset:2px;border-radius:10px}
body.navmode .card:focus .art{transform:translateY(-4px) scale(1.04);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--cc,var(--accent)),0 22px 50px -14px #000}
body.navmode .card:focus .t{color:#fff}
body.navmode .nav button:focus{background:#1d2333;color:var(--text);outline:none;box-shadow:inset 0 0 0 2px var(--cc)}
body.couch.navmode{cursor:none}
#hints{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:40;display:none;gap:18px;align-items:center;background:rgba(14,17,24,.92);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:8px 20px;font-size:13px;color:var(--dim);white-space:nowrap}
body.couch #hints{display:flex}
body.couch.abon #hints{bottom:96px}
#hints b{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:12px;font-size:11.5px;font-weight:800;color:#0b0d12;margin-right:6px;background:#cfd5e2}
#hints b.a{background:#3ecf8e}#hints b.b{background:#ff6b6b}#hints b.x{background:#4aa8ff}#hints b.y{background:#f5b642}
body.couch #view{padding-bottom:150px}
#osk{position:fixed;inset:0;z-index:60;background:rgba(5,6,9,.72);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;padding-bottom:70px}
#osk.on{display:flex}
#osk .pad{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 30px 70px -20px #000}
#osk .val{font-size:22px;padding:10px 14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;min-height:50px}
#osk .val::after{content:"▏";color:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#osk .rows{display:flex;flex-direction:column;gap:7px}
#osk .r{display:flex;gap:7px;justify-content:center}
#osk .k{width:52px;height:50px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:18px;font-weight:600;text-transform:uppercase}
#osk .k.w{width:150px;font-size:14px;text-transform:none}
#osk .k:focus{background:var(--accent);color:#0b0d12;outline:none}
#toasts{position:fixed;right:22px;bottom:100px;z-index:50;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:#1f2533;border:1px solid var(--line);border-left:3px solid var(--accent);padding:11px 16px;border-radius:10px;font-size:13.5px;max-width:420px;box-shadow:0 14px 30px -14px #000;animation:tin .2s ease}
.toast.bad{border-left-color:var(--bad)}.toast.ok{border-left-color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><div class="logo"></div>Argus</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="side-sep"></div>
      <nav class="nav" id="nav2"></nav>
      <button class="btn small" id="updBtn" style="display:none;margin:8px 12px 0;--cc:var(--ok)"></button>
      <div id="scanStatus"></div>
    </div>
  </aside>
  <main id="main">
    <div id="top">
      <label id="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" placeholder="Search movies, shows, music videos, books, audiobooks, games…" autocomplete="off"><kbd>/</kbd></label>
    </div>
    <div id="view"></div>
    <div id="detail"><div class="sheet" id="sheet"></div></div>
    <div id="ab">
      <img id="abImg" alt="">
      <div class="info"><b id="abTitle"></b><span id="abSub"></span></div>
      <div class="ctl">
        <button id="abPrev" title="Previous track"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg></button>
        <button id="abBack" title="Back 30s"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
        <button id="abPlay" class="pp" title="Play/Pause"></button>
        <button id="abFwd" title="Forward 30s"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
        <button id="abShuf" title="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
        <button id="abNext" title="Next track"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg></button>
      </div>
      <div class="seek"><span id="abCur">0:00</span><input type="range" id="abSeek" min="0" max="1000" value="0"><span id="abDur">0:00</span></div>
      <select id="abRate" title="Speed"><option>0.8</option><option selected>1</option><option>1.15</option><option>1.25</option><option>1.5</option><option>1.75</option><option>2</option></select>
      <button class="btn small ghost" id="abClose" title="Close">✕</button>
      <audio id="abAudio" preload="metadata"></audio>
    </div>
  </main>
</div>
<div id="toasts"></div>
<div id="tmenu"></div>
<div id="hints"><span><b class="a">A</b>Select</span><span><b class="b">B</b>Back</span><span><b class="x">X</b>Play</span><span><b class="y">Y</b>Search</span><span><b>LB</b><b>RB</b>Category</span><span><b>LT</b><b>RT</b>Scroll</span><span><b>☰</b>Exit couch mode</span></div>
<div id="osk"><div class="pad"><div class="val" id="oskVal"></div><div class="rows" id="oskRows"></div><div class="note" style="margin-top:12px;text-align:center">A type · X delete · Y space · B done</div></div></div>

<script>
/* ============================== constants ============================== */
const CATS = [
  { id: 'movies', label: 'Movies', shape: '', icon: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5M16 4v5"/>' },
  { id: 'tv', label: 'TV Shows', shape: '', icon: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="m8 2 4 4 4-4"/>' },
  { id: 'music', label: 'Music', shape: 'square', icon: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 3a9 9 0 0 1 9 9"/>' },
  { id: 'musicvideos', label: 'Music Videos', shape: 'wide', icon: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>' },
  { id: 'books', label: 'Books', shape: '', icon: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>' },
  { id: 'audiobooks', label: 'Audiobooks', shape: 'square', icon: '<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><rect x="2" y="15" width="5" height="7" rx="2"/><rect x="17" y="15" width="5" height="7" rx="2"/>' },
  { id: 'games', label: 'Games', shape: '', icon: '<rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3"/><circle cx="16" cy="11.5" r="1"/><circle cx="18" cy="13.5" r="1"/>' },
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const ICON = {
  home: '<path d="m3 11 9-8 9 8"/><path d="M5 9.5V21h14V9.5"/>',
  setup: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  scan: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  play: '<path d="M7 4v16l13-8z" fill="currentColor" stroke="none"/>',
  pause: '<path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor" stroke="none"/>',
  cloud: '<path d="M17.5 19H7a5 5 0 1 1 1.2-9.9A6 6 0 0 1 19.5 11 4 4 0 0 1 17.5 19z"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  ext: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  dl: '<path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/>',
  book: '<path d="M2 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2zM22 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/>',
};
const svg = (p, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const REGIONS = ['US', 'CA', 'GB', 'IE', 'AU', 'NZ', 'DE', 'FR', 'ES', 'IT', 'NL', 'SE', 'NO', 'DK', 'FI', 'BR', 'MX', 'JP', 'IN'];

/* ============================== state ============================== */
let cfg, lib, ust, catalog;
const ui = { view: 'home', filter: {}, sort: {}, q: '', setupTab: 'general', draft: null, scanning: false };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fileUrl = p => 'file:///' + String(p).replace(/\\/g, '/').split('/').map((seg, i) => i === 0 && /^[a-z]:$/i.test(seg) ? seg : encodeURIComponent(seg)).join('/');
const fmtTime = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const fmtSize = b => !b ? '' : b > 1e9 ? (b / 1e9).toFixed(1) + ' GB' : (b / 1e6).toFixed(0) + ' MB';
function toast(msg, kind = '') { const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg; $('#toasts').appendChild(t); setTimeout(() => t.remove(), 4800); }

/* ============================== services ============================== */
function svcDefs(cat) { return cat === 'music' ? catalog.audio : cat === 'musicvideos' ? catalog.music : (cat === 'movies' || cat === 'tv') ? catalog.video : []; }
function enabledServices(cat) {
  const c = cfg.categories[cat]; if (!c || !c.services) return [];
  const defs = svcDefs(cat);
  return c.services.map(s => s.custom ? s : { ...(defs.find(d => d.id === s.id) || {}), ...s }).filter(s => s.name);
}
function svcHome(s) { return s.base || s.url; }
function svcSearch(s, q) {
  if (!s.search || (s.needsBase && !s.base)) return svcHome(s);
  return s.search.replace('{base}', (s.base || '').replace(/\/$/, '')).replace('{q}', encodeURIComponent(q));
}
function svcMatchesProvider(s, p) {
  return (s.providers || []).some(x => typeof x === 'number' ? x === p.id : p.name.toLowerCase().includes(x));
}
function svcButton(s, url, big) {
  const initial = esc((s.name || '?')[0]);
  return `<button class="svc ${big ? 'big' : ''}" style="--sc:${esc(s.color || '#888')}" data-url="${esc(url)}"><span class="dot">${initial}</span>${esc(s.name)}</button>`;
}

/* ============================== rendering helpers ============================== */
function itemsOf(cat) { return (lib && lib[cat]) || []; }
function subtitle(it) {
  if (it.cat === 'movies') return [it.year, it.genres && it.genres[0]].filter(Boolean).join(' · ');
  if (it.cat === 'tv') { const s = new Set(it.episodes.map(e => e.season)); return [it.year, s.size + (s.size === 1 ? ' season' : ' seasons') + ' · ' + it.episodes.length + ' ep'].filter(Boolean).join(' · '); }
  if (it.cat === 'musicvideos') return it.artist;
  if (it.cat === 'music') return [it.artist, it.year].filter(Boolean).join(' · ');
  if (it.cat === 'books') return [it.author, it.format].filter(Boolean).join(' · ');
  if (it.cat === 'audiobooks') return [it.author, it.files.length > 1 ? it.files.length + ' tracks' : null].filter(Boolean).join(' · ');
  if (it.cat === 'games') return it.sourceLabel + (it.gamepass && it.gamepass.cloud ? ' · Cloud' : '');
  return '';
}
function badges(it) {
  const b = [];
  if (it.cat === 'games') {
    if (it.source === 'gamepass' || it.gamepass) b.push(`<span class="badge gp">Game Pass</span>`);
    if (it.gamepass && it.gamepass.cloud) b.push(`<span class="badge cloud">Cloud</span>`);
    if (it.source === 'psplus') b.push(`<span class="badge ps">PS Plus</span>`);
    if (it.source === 'torbox') b.push(`<span class="badge tb">TorBox</span>`);
    if (it.installed && !['gamepass'].includes(it.source)) b.push(`<span class="badge">${esc(it.sourceLabel)}</span>`);
  } else {
    if ((it.sources || []).includes('torbox')) b.push(`<span class="badge tb">TorBox</span>`);
    if (it.cat === 'books' && it.format) b.push(`<span class="badge">${esc(it.format)}</span>`);
  }
  return b.join('');
}
function artHtml(it, cls = '') {
  const src = it.poster;
  const ph = `<div class="ph" ${src ? 'style="display:none"' : ''}><b>${esc(it.title)}</b><span>${esc(subtitle(it))}</span></div>`;
  if (!src) return ph;
  const fb = it.posterFallback ? ` data-fb="${esc(it.posterFallback)}"` : '';
  return `<img loading="lazy" class="${it.posterIsLogo ? 'logo' : ''} ${cls}" src="${esc(src)}"${fb} alt="">${ph}`;
}
/* ---------- watch progress helpers ---------- */
const VIDEO_CATS = new Set(['movies', 'tv', 'musicvideos']);
const epKey = (it, e) => `${it.id}:${e.season}:${e.episode}`;
const prog = k => ust.progress[k];
const sxe = e => `S${String(e.season).padStart(2, '0')}E${String(e.episode).padStart(2, '0')}`;
const timeLeft = p => p && p.dur ? fmtTime(Math.max(0, p.dur - p.pos)) : '';
function epList(it) {
  const m = new Map();
  for (const e of it.episodes || []) { const k = e.season + ':' + e.episode; if (!m.has(k) || e.source === 'local') m.set(k, e); }
  return [...m.values()].sort((a, b) => (a.season === 0) - (b.season === 0) || a.season - b.season || a.episode - b.episode);
}
// What to play next for a show: the most recent half-watched episode, else the one after the last watched
function nextUp(it) {
  const eps = epList(it);
  const inprog = eps.map(e => ({ e, p: prog(epKey(it, e)) })).filter(x => x.p && !x.p.watched && x.p.pos > 30).sort((a, b) => b.p.t - a.p.t)[0];
  if (inprog) return { ep: inprog.e, resume: inprog.p.pos, p: inprog.p, started: true };
  let lastIdx = -1;
  eps.forEach((e, i) => { const p = prog(epKey(it, e)); if (p && p.watched) lastIdx = i; });
  const ep = eps[lastIdx + 1];
  return ep ? { ep, resume: 0, started: lastIdx >= 0 } : null;
}
function showStats(it) { const eps = epList(it); const w = eps.filter(e => (prog(epKey(it, e)) || {}).watched).length; return { total: eps.length, watched: w }; }
function lastWatchT(it) {
  if (it.cat === 'tv') return Math.max(0, ...epList(it).map(e => (prog(epKey(it, e)) || {}).t || 0));
  return (prog(it.id) || {}).t || 0;
}
function card(it) {
  const cc = `var(--c-${it.cat})`;
  let bar = 0, done = false, m = subtitle(it);
  if (it.cat === 'tv') {
    const st = showStats(it), nu = nextUp(it);
    done = st.total > 0 && st.watched === st.total;
    if (!done && st.watched) bar = st.watched / st.total;
    if (nu && nu.started) m = `Next: ${sxe(nu.ep)}${nu.resume ? ' · ' + timeLeft(nu.p) + ' left' : ''}`;
  } else {
    const pr = ust.progress[it.id];
    if (pr) { done = !!pr.watched && VIDEO_CATS.has(it.cat); if (!done && pr.pct) bar = pr.pct; }
  }
  const progHtml = bar ? `<div class="prog"><i style="width:${Math.min(100, bar * 100)}%"></i></div>` : '';
  return `<div class="card" tabindex="0" data-id="${esc(it.id)}" data-cat="${it.cat}" style="--cc:${cc}">
    <div class="art">${artHtml(it)}<div class="badges">${badges(it)}${done ? '<span class="badge w">✓ Watched</span>' : ''}</div>${progHtml}</div>
    <div class="t">${esc(it.title)}</div><div class="m">${esc(m) || '&nbsp;'}</div></div>`;
}
function wireImages(root) {
  root.querySelectorAll('img').forEach(img => {
    const fail = () => {
      if (img.dataset.fb && img.src !== img.dataset.fb) { img.src = img.dataset.fb; img.dataset.fb = ''; return; }
      img.style.display = 'none'; const ph = img.nextElementSibling; if (ph && ph.classList.contains('ph')) ph.style.display = 'flex';
    };
    img.addEventListener('error', fail);
    if (img.complete && img.getAttribute('src') && img.naturalWidth === 0) fail(); // failed before we attached
  });
}
function wireCards(root) {
  root.querySelectorAll('.card').forEach(c => {
    const open = () => openDetail(c.dataset.cat, c.dataset.id);
    c.addEventListener('click', open);
    c.addEventListener('keydown', e => { if (e.key === 'Enter') open(); });
  });
  root.querySelectorAll('[data-url]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); window.api.openExternal(b.dataset.url); }));
  wireImages(root);
}

/* ============================== nav ============================== */
function renderNav() {
  const btn = (id, label, icon, cc, n) => `<button data-v="${id}" class="${ui.view === id ? 'on' : ''}" style="--cc:var(--c-${cc})">${svg(icon)}<span>${label}</span>${n != null ? `<span class="n">${n}</span>` : ''}</button>`;
  $('#nav').innerHTML = btn('home', 'Home', ICON.home, 'home') +
    CATS.filter(c => cfg.categories[c.id].enabled).map(c => btn(c.id, c.label, c.icon, c.id, itemsOf(c.id).length || null)).join('');
  $('#nav2').innerHTML = btn('setup', 'Library Setup', ICON.setup, 'setup') +
    `<button data-act="scan" style="--cc:var(--accent)">${svg(ICON.scan)}<span>${ui.scanning ? 'Scanning…' : 'Rescan library'}</span></button>`;
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => go(b.dataset.v));
  document.querySelector('[data-act=scan]').onclick = () => rescan();
}
function go(v) { if (v !== ui.view || v === 'games') { ui.gamesView = null; ui.gLimit = 0; } ui.view = v; ui.q = ''; $('#q').value = ''; closeDetail(); render(); $('#view').scrollTop = 0; }

/* ============================== views ============================== */
function render() {
  renderNav();
  if (ui.q) return renderSearch();
  if (ui.view === 'home') return renderHome();
  if (ui.view === 'setup') return renderSetup();
  return renderCategory(ui.view);
}

function renderHome() {
  const all = CATS.filter(c => cfg.categories[c.id].enabled).flatMap(c => itemsOf(c.id));
  const total = all.length;
  if (!total) {
    $('#view').innerHTML = `<h1 class="cat">Welcome, let's build your library</h1>

const FILTERS = {

const SORTS = { title: 'Title', artist: 'Artist / author', added: 'Recently added', year: 'Year', rating: 'Rating' };

function filtered(cat) {

  } else if (f !== 'all') items = items.filter(i => (i.sources || []).includes(f));

  const s = ui.sort[cat] || (cat === 'games' ? 'title' : cat === 'music' ? 'artist' : 'added');

const SRC_LABEL = { steam: 'Steam', epic: 'Epic', gog: 'GOG', xbox: 'Xbox app', ubisoft: 'Ubisoft', folder: 'Folders', manual: 'Manual' };
function gameCollections() {

  }
  const gp = games.filter(g => g.source === 'gamepass' || g.gamepass);
  if (gp.length) cols.push({ key: 'gamepass', group: 'pc', name: 'Xbox Game Pass', sub: `${gp.filter(g => g.installed).length} installed`, color: '#107C10', glyph: 'pad', items: gp });

  const retro = games.filter(g => g.source === 'emulator');
  const order = emuSys.map(s => s.id);
  const bySys = {};
  retro.forEach(g => (bySys[g.system] = bySys[g.system] || []).push(g));
  for (const id of Object.keys(bySys).sort((a, b) => order.indexOf(a) - order.indexOf(b))) {
    const sys = sysOf(id);

let BUNDLED_TILES = { pc: '../assets/tiles/pc.jpg', nes: '../assets/tiles/nes.jpg' };

function mosaicFor(items, n = 8) {

    if (!hits.length) continue;
    any = true;
    html += `<div class="rowhead"><h3>${c.label}</h3><span class="sub">${hits.length}</span></div><div class="grid ${c.shape}" style="--cc:var(--c-${c.id})">${hits.map(card).join('')}</div>`;
  }
  // streaming search shortcuts
  const svcs = [...new Map([...enabledServices('movies'), ...enabledServices('tv'), ...enabledServices('music'), ...enabledServices('musicvideos')].map(s => [s.id, s])).values()];
  if (svcs.length) html += `<div class="rowhead"><h3>Search your services</h3></div><div class="services">${svcs.map(s => svcButton(s, svcSearch(s, ui.q))).join('')}</div>`;
  if (!any) html += `<div class="empty" style="margin-top:20px">Nothing in your library matches.</div>`;
  $('#view').innerHTML = html;
  wireCards($('#view'));
}

/* ============================== detail ============================== */
function findItem(cat, id) { return itemsOf(cat).find(i => i.id === id); }
function closeDetail() { const was = $('#detail').classList.contains('on'); $('#detail').classList.remove('on'); if (was && ui.watchDirty) { ui.watchDirty = false; setTimeout(() => render(), 0); } }

async function openDetail(cat, id) {
  const it = findItem(cat, id); if (!it) return;
  const cc = `var(--c-${cat})`;
  const shape = CAT[cat].shape;
  const facts = [];
  if (it.year) facts.push(it.year);
  if (it.meta && it.meta.runtime) facts.push(it.meta.runtime + ' min');
  if (it.rating) facts.push(`<span class="rate">★ ${it.rating}</span>`);
  if (it.genres && it.genres.length && it.source !== 'emulator') facts.push(esc(it.genres.slice(0, 4).join(', ')));
  if (it.region) facts.push(esc(it.region));
  if (it.artist) facts.push(esc(it.artist));
  if (it.author) facts.push('by ' + esc(it.author));
  if (it.format) facts.push(esc(it.format));
  if (it.cat === 'games') facts.push(esc(it.sourceLabel), it.publisher ? esc(it.publisher) : '');

  let body = `<button class="x" id="dx">✕</button>
    <div class="bd">${it.backdrop ? `<img src="${esc(it.backdrop)}" alt="">` : ''}</div>
    <div class="dwrap" style="--cc:${cc}">
      <div><div class="poster ${shape === 'square' ? 'sq' : shape === 'wide' ? 'wd' : ''}" style="position:relative">${artHtml(it)}</div></div>
      <div>
        <div class="dtitle">${esc(it.title)}</div>
        <div class="facts">${facts.filter(Boolean).join('<span>·</span>')}</div>
        ${it.meta && it.meta.tagline ? `<div class="note" style="margin-top:8px;font-style:italic">${esc(it.meta.tagline)}</div>` : ''}
        ${it.overview ? `<p class="overview">${esc(it.overview)}</p>` : ''}
        <div class="actions" id="dActions"></div>
        <div id="dBody"></div>
      </div></div>`;
  $('#sheet').innerHTML = body;
  $('#sheet').scrollTop = 0;
  $('#detail').classList.add('on');
  $('#dx').onclick = closeDetail;
  wireImages($('#sheet'));

  const A = $('#dActions'), B = $('#dBody');
  if (cat === 'movies') detailMovie(it, A, B);
  else if (cat === 'tv') detailTv(it, A, B);
  else if (cat === 'musicvideos') detailMv(it, A, B);
  else if (cat === 'music') detailMusic(it, A, B);
  else if (cat === 'books') detailBook(it, A, B);
  else if (cat === 'audiobooks') detailAudiobook(it, A, B);
  else if (cat === 'games') detailGame(it, A, B);
  $('#sheet').querySelectorAll('[data-url]').forEach(b => b.onclick = () => window.api.openExternal(b.dataset.url));
}

async function doPlay(req, it) {
  if (req.launch && req.launch.type === 'romzip') toast('Unpacking ROM from the archive…');
  const r = await window.api.play(req);
  if (r && r.ok === false) toast(r.error || 'Could not open', 'bad');
  else {
    if (r && r.note) toast(r.note);
    if (r && r.via === 'default' && req.track && !ui.warnedDefault) { ui.warnedDefault = true; toast('Watch progress isn’t tracked with the Windows default player. Pick mpv, VLC or the built-in player in Library Setup → General.'); }
    if (it) { ust = await window.api.markPlayed(it.id); }
  }
}

function fileRows(it, action, labelFor) {
  return `<div class="filelist">${it.files.map((f, i) => `<div class="frow"><span class="src ${f.source === 'torbox' ? 'tb' : ''}">${f.source === 'torbox' ? 'TorBox' : 'Local'}</span>
    <span class="nm" title="${esc(f.path || f.name)}">${esc(f.name)}</span><span class="sub">${fmtSize(f.size)}</span>
    <button class="btn small" data-fi="${i}">${labelFor(f)}</button>
    ${f.source === 'local' ? `<button class="btn small ghost" data-folder="${i}" title="Show in folder">${svg(ICON.folder, 15)}</button>` : ''}</div>`).join('')}</div>`;
}
function wireFileRows(root, it, action) {
  root.querySelectorAll('[data-fi]').forEach(b => b.onclick = () => action === 'video' && VIDEO_CATS.has(it.cat) ? playVideoItem(it, it.files[+b.dataset.fi], it.title, it.id, 0) : doPlay({ action, file: it.files[+b.dataset.fi], title: it.title }, it));
  root.querySelectorAll('[data-folder]').forEach(b => b.onclick = () => window.api.play({ action: 'folder', path: it.files[+b.dataset.folder].path }));
}

function watchSection(it, cat) {
  const svcs = enabledServices(cat);
  const w = it.meta && it.meta.watch;
  let html = '';
  if (svcs.length) {
    const avail = w ? svcs.filter(s => w.stream.some(p => svcMatchesProvider(s, p))) : [];
    const others = svcs.filter(s => !avail.includes(s));
    if (avail.length) html += `<div class="sect"><h4>Streaming on your services</h4><div class="services">${avail.map(s => svcButton(s, svcSearch(s, it.title), true)).join('')}</div></div>`;
    if (others.length) html += `<div class="sect"><h4>${avail.length ? 'Search your other services' : 'Search your services'}</h4><div class="services">${others.map(s => svcButton(s, svcSearch(s, it.title))).join('')}</div></div>`;
  }
  if (w && (w.stream.some(p => p.logo) || w.rent.some(p => p.logo) || w.link)) {
    const notMine = w.stream.filter(p => !svcs.some(s => svcMatchesProvider(s, p)));
    html += `<div class="sect"><h4>Where else (${esc(cfg.region)})</h4><div class="provs">
      ${notMine.map(p => p.logo ? `<img title="Stream: ${esc(p.name)}" src="${esc(p.logo)}">` : '').join('')}
      ${w.rent.slice(0, 8).map(p => p.logo ? `<img style="opacity:.55" title="Rent/Buy: ${esc(p.name)}" src="${esc(p.logo)}">` : '').join('')}
      ${w.link ? `<button class="btn small ghost" data-url="${esc(w.link)}">${svg(ICON.ext, 14)} All options</button>` : ''}</div>
      <div class="note" style="margin-top:8px">Availability data from TMDB / JustWatch.</div></div>`;
  }
  return html;
}

function reclassifyHtml(it) {
  const keys = [...new Set((it.files || it.episodes || []).filter(f => f.tb).map(f => f.tb.key))];
  if (!keys.length) return '';
  const opts = CATS.filter(c => c.id !== 'games' || true).map(c => `<option value="${c.id}" ${c.id === it.cat ? 'selected' : ''}>${c.label}</option>`).join('');
  return `<div class="sect"><h4>TorBox</h4><div class="inline"><span class="note">Wrong category? Move this TorBox item to</span>
    <select class="sel" id="reclass">${opts}</select></div></div>`;
}
function wireReclass(it) {
  const s = $('#reclass'); if (!s) return;
  s.onchange = async () => {
    const keys = [...new Set((it.files || it.episodes || []).filter(f => f.tb).map(f => f.tb.key))];
    toast('Re-filing TorBox item…');
    for (const k of keys) await window.api.torboxOverride(k, s.value);
    lib = await window.api.getLibrary(); closeDetail(); render(); toast('Moved to ' + CAT[s.value].label, 'ok');
  };
}

function playVideoItem(it, file, title, key, resume) { return doPlay({ action: 'video', file, title, track: { key, resume: resume || 0 } }, it); }
function watchControls(it, key, A, label, files) {
  // files: [{file, label}] — first is the main one. Adds Resume/Play, Start over, Mark watched + a progress line.
  const p = prog(key), resumable = p && !p.watched && p.pos > 30;
  const [main, ...rest] = files;
  let h = resumable
    ? `<button class="btn primary" id="wResume">${svg(ICON.play, 16)} Resume · ${fmtTime(p.pos)}</button><button class="btn" id="wStart">Start over</button>`
    : `<button class="btn primary" id="wResume">${svg(ICON.play, 16)} ${main.label}</button>`;
  h += rest.map((r, i) => `<button class="btn" data-alt="${i}">${svg(ICON.play, 16)} ${r.label}</button>`).join('');
  h += `<button class="btn ghost" id="wMark">${p && p.watched ? '↺ Mark unwatched' : '✓ Mark watched'}</button>`;
  A.innerHTML = h + A.innerHTML;
  if (resumable) A.insertAdjacentHTML('afterend', `<div class="wline"><b>${Math.round(p.pct * 100)}% watched</b> · ${timeLeft(p)} left</div>`);
  else if (p && p.watched) A.insertAdjacentHTML('afterend', `<div class="wline">✓ Watched</div>`);
  $('#wResume').onclick = () => playVideoItem(it, main.file, label, key, resumable ? p.pos : 0);
  if ($('#wStart')) $('#wStart').onclick = () => playVideoItem(it, main.file, label, key, 0);
  A.querySelectorAll('[data-alt]').forEach(b => b.onclick = () => playVideoItem(it, rest[+b.dataset.alt].file, label, key, resumable ? p.pos : 0));
  $('#wMark').onclick = async () => { ust = await window.api.markWatched([key], !(p && p.watched)); openDetail(it.cat, it.id); };
}
function detailMovie(it, A, B) {
  const local = it.files.find(f => f.source === 'local'), tb = it.files.find(f => f.source === 'torbox');
  const files = [local && { file: local, label: 'Play' }, tb && { file: tb, label: 'Stream from TorBox' }].filter(Boolean);
  if (files.length) watchControls(it, it.id, A, it.title, files);
  let html = watchSection(it, 'movies');
  if (it.meta && it.meta.cast && it.meta.cast.length) html += `<div class="sect"><h4>Cast</h4><div class="note">${esc(it.meta.cast.join(', '))}</div></div>`;
  if (it.files.length) html += `<div class="sect"><h4>Files</h4>${fileRows(it, 'video', () => 'Play')}</div>`;
  html += reclassifyHtml(it);
  B.innerHTML = html; wireFileRows(B, it, 'video'); wireReclass(it);
}

async function detailTv(it, A, B) {
  const metaSeasons = (it.meta && it.meta.seasons || []).filter(s => s.n > 0 || it.episodes.some(e => e.season === 0));
  const have = [...new Set(it.episodes.map(e => e.season))];
  const seasons = [...new Set([...metaSeasons.map(s => s.n), ...have])].sort((a, b) => (a === 0) - (b === 0) || a - b);
  let cur0 = null;
  let cur = have.length ? Math.min(...have.filter(n => n > 0).concat(have)) : seasons[0];
  const nu = nextUp(it);
  const st = showStats(it);
  if (nu) {
    A.innerHTML = `<button class="btn primary" id="pNext">${svg(ICON.play, 16)} ${nu.resume ? `Resume ${sxe(nu.ep)} · ${fmtTime(nu.resume)}` : `${nu.started ? 'Next up: ' : 'Play '}${sxe(nu.ep)}`}</button>`;
    $('#pNext').onclick = () => playEp(it, nu.ep, nu.resume);
    if (nu.ep.season !== undefined) cur0 = nu.ep.season;
  }
  if (st.watched) A.insertAdjacentHTML('afterend', `<div class="wline"><b>${st.watched} of ${st.total}</b> episodes watched${st.watched === st.total ? ' ✓' : ''}</div>`);
  B.innerHTML = `<div class="sect"><h4 style="display:flex;align-items:center;gap:12px">Episodes <button class="btn small ghost" id="seasonMark" style="text-transform:none;letter-spacing:0"></button></h4><div class="seasons" id="seasons"></div><div class="eps" id="eps"></div></div>` + watchSection(it, 'tv') + reclassifyHtml(it);
  wireReclass(it);
  B.querySelectorAll('[data-url]').forEach(b => b.onclick = () => window.api.openExternal(b.dataset.url));
  const drawSeasons = () => {
    $('#seasons').innerHTML = seasons.map(n => `<button class="chip ${n === cur ? 'on' : ''}" data-s="${n}">${n === 0 ? 'Specials' : 'Season ' + n}${have.includes(n) ? '' : ' ·'}</button>`).join('');
    $('#seasons').querySelectorAll('[data-s]').forEach(b => b.onclick = () => { cur = +b.dataset.s; drawSeasons(); drawEps(); });
  };
  const drawEps = async () => {
    const mine = it.episodes.filter(e => e.season === cur);
    let meta = [];
    $('#eps').innerHTML = epRows(it, mine, []);
    wireEps(it, mine);
    if (it.meta && it.meta.tmdbId) {
      meta = await window.api.season(it.meta.tmdbId, cur);
      if (Array.isArray(meta) && meta.length && cur === +($('#seasons .chip.on') || {}).dataset?.s) { $('#eps').innerHTML = epRows(it, mine, meta); wireEps(it, mine); }
    }
  };
  if (cur0 !== null && seasons.includes(cur0)) cur = cur0;
  const paintSeasonMark = () => {
    const keys = epList(it).filter(e => e.season === cur).map(e => epKey(it, e));
    const all = keys.length && keys.every(k => (prog(k) || {}).watched);
    $('#seasonMark').textContent = all ? '↺ Mark season unwatched' : '✓ Mark season watched';
    $('#seasonMark').style.display = keys.length ? '' : 'none';
    $('#seasonMark').onclick = async () => { ust = await window.api.markWatched(keys, !all); drawEps(); paintSeasonMark(); };
  };
  drawSeasons(); drawEps(); paintSeasonMark();
  $('#seasons').addEventListener('click', () => setTimeout(paintSeasonMark, 0));
}
function epRows(it, mine, meta) {
  const nums = [...new Set([...meta.map(m => m.n), ...mine.map(e => e.episode)])].sort((a, b) => a - b);
  return nums.map(n => {
    const m = meta.find(x => x.n === n) || {};
    const files = mine.filter(e => e.episode === n);
    const title = m.title || (files[0] && files[0].title) || 'Episode ' + n;
    const local = files.find(f => f.source === 'local'), tb = files.find(f => f.source === 'torbox');
    const season = (mine[0] || {}).season, p = prog(`${it.id}:${season}:${n}`);
    const bar = p && !p.watched && p.pct ? `<div class="eprog"><i style="width:${Math.round(p.pct * 100)}%"></i></div>` : '';
    return `<div class="ep ${files.length ? '' : 'miss'} ${p && p.watched ? 'done' : ''}"><div class="still">${m.still ? `<img loading="lazy" src="${esc(m.still)}">` : 'E' + n}${bar}${p && p.watched ? '<span class="wk">✓</span>' : ''}</div>
      <div><div class="et">${n}. ${esc(title)}</div><div class="eo">${esc(m.overview || (files[0] ? files[0].name : ''))}</div></div>
      <div class="eb">${local ? `<button class="btn small" data-ep="${n}" data-src="local">${svg(ICON.play, 13)} ${p && !p.watched && p.pos > 30 ? 'Resume' : 'Play'}</button>` : ''}
      ${tb ? `<button class="btn small" data-ep="${n}" data-src="torbox">${svg(ICON.play, 13)} TorBox</button>` : ''}
      ${files.length ? `<button class="btn small ghost" data-wk="${n}" >${p && p.watched ? '↺ Unwatch' : '✓ Watched'}</button>` : ''}
      ${!files.length ? `<span class="note">Not in library</span>` : ''}</div></div>`;
  }).join('') || '<div class="note">No episodes.</div>';
}
function wireEps(it, mine) {
  $('#eps').querySelectorAll('[data-ep]').forEach(b => b.onclick = () => {
    const f = mine.find(e => e.episode === +b.dataset.ep && e.source === b.dataset.src);
    const p = prog(epKey(it, f));
    playEp(it, f, p && !p.watched && p.pos > 30 ? p.pos : 0);
  });
  $('#eps').querySelectorAll('[data-wk]').forEach(b => b.onclick = async () => {
    const e = mine.find(x => x.episode === +b.dataset.wk); const k = epKey(it, e); const p = prog(k);
    ust = await window.api.markWatched([k], !(p && p.watched));
    const sel = $('#seasons .chip.on'); if (sel) sel.click();
  });
}
async function playEp(it, ep, resume) {
  await playVideoItem(it, ep, `${it.title} ${sxe(ep)}`, epKey(it, ep), resume || 0);
}

function detailMv(it, A, B) {
  const f = it.files[0];
  watchControls(it, it.id, A, `${it.artist} - ${it.title}`, [{ file: f, label: f.source === 'torbox' ? 'Stream from TorBox' : 'Play' }]);
  const m = it.meta || {};
  if (m.youtube) A.innerHTML += `<button class="btn" data-url="https://www.youtube.com/watch?v=${esc(m.youtube)}">${svg(ICON.ext, 15)} Official video</button>`;
  if (m.url) A.innerHTML += `<button class="btn ghost" data-url="${esc(m.url)}">${svg(ICON.ext, 15)} IMVDb</button>`;
  const svcs = enabledServices('musicvideos');
  let html = svcs.length ? `<div class="sect"><h4>Find on your services</h4><div class="services">${svcs.map(s => svcButton(s, svcSearch(s, it.artist + ' ' + it.title), true)).join('')}</div></div>` : '';
  html += `<div class="sect"><h4>File</h4>${fileRows(it, 'video', () => 'Play')}</div>` + reclassifyHtml(it);
  B.innerHTML = html; wireFileRows(B, it, 'video'); wireReclass(it);
}

function detailMusic(it, A, B) {
  A.innerHTML = `<button class="btn primary" id="pAl">${svg(ICON.play, 16)} Play album</button><button class="btn" id="pSh">${svg('<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>', 16)} Shuffle</button>
    ${it.files.some(f => f.source === 'local') ? `<button class="btn ghost" id="pDir">${svg(ICON.folder, 15)} Album folder</button>` : ''}`;
  $('#pAl').onclick = () => { ab.shuffle = false; abLoad(it, 0, 0, it.files.map((_, i) => i)); };
  $('#pSh').onclick = () => { ab.shuffle = true; const o = shuffled(it.files.map((_, i) => i)); abLoad(it, o[0], 0, o); };
  if ($('#pDir')) $('#pDir').onclick = () => window.api.play({ action: 'folder', path: it.files.find(f => f.source === 'local').path });
  const multiDisc = new Set(it.files.map(f => f.disc || 1)).size > 1;
  const svcs = enabledServices('music');
  let html = `<div class="sect"><h4>${it.files.length} ${it.files.length === 1 ? 'track' : 'tracks'}</h4><div class="filelist">${it.files.map((f, i) => `<div class="frow" data-playing="${esc(it.id)}:${i}" data-tr="${i}" style="cursor:pointer">
    <span class="sub" style="width:34px;font-variant-numeric:tabular-nums">${multiDisc ? (f.disc || 1) + '-' : ''}${f.track || i + 1}</span>
    <span class="nm" style="color:var(--text)">${esc(f.title || f.name)}${f.artist && f.artist !== it.artist ? `<span class="sub"> · ${esc(f.artist)}</span>` : ''}</span>
    ${f.source === 'torbox' ? '<span class="src tb">TorBox</span>' : ''}<button class="btn small" data-tr="${i}">${svg(ICON.play, 13)}</button></div>`).join('')}</div></div>`;
  if (svcs.length) html += `<div class="sect"><h4>Find on your services</h4><div class="services">${svcs.map(s => svcButton(s, svcSearch(s, it.artist + ' ' + it.title), true)).join('')}</div></div>`;
  html += reclassifyHtml(it);
  B.innerHTML = html;
  B.querySelectorAll('[data-tr]').forEach(r => r.onclick = e => { e.stopPropagation(); abLoad(it, +r.dataset.tr, 0, ab.shuffle ? [+r.dataset.tr, ...shuffled(it.files.map((_, i) => i).filter(x => x !== +r.dataset.tr))] : it.files.map((_, i) => i)); });
  if (ab.it === it) B.querySelectorAll('[data-playing]').forEach(r => r.classList.toggle('now', r.dataset.playing === it.id + ':' + ab.track));
  wireReclass(it);
}

function detailBook(it, A, B) {
  const f = it.files[0];
  A.innerHTML = `<button class="btn primary" id="pBk">${svg(f.source === 'torbox' ? ICON.dl : ICON.book, 16)} ${f.source === 'torbox' ? 'Download & open' : 'Read'}</button>`;
  $('#pBk').onclick = () => doPlay({ action: 'book', file: f, title: it.title }, it);
  B.innerHTML = `<div class="sect"><h4>File</h4>${fileRows(it, 'book', x => x.source === 'torbox' ? 'Download' : 'Open')}</div>` + reclassifyHtml(it)
    + `<div class="note" style="margin-top:14px">Books open in your default reader for that format (set it in Windows → Default apps).</div>`;
  wireFileRows(B, it, 'book'); wireReclass(it);
}

function detailAudiobook(it, A, B) {
  const pr = ust.progress[it.id];
  A.innerHTML = `<button class="btn primary" id="pAb">${svg(ICON.play, 16)} ${pr && pr.pos ? 'Resume · ' + (it.files.length > 1 ? 'track ' + (pr.track + 1) + ' · ' : '') + fmtTime(pr.pos) : 'Listen'}</button>
    ${pr && pr.pos ? `<button class="btn" id="pAb0">Start over</button>` : ''}`;
  $('#pAb').onclick = () => abLoad(it, pr ? pr.track : 0, pr ? pr.pos : 0);
  if ($('#pAb0')) $('#pAb0').onclick = () => abLoad(it, 0, 0);
  B.innerHTML = `<div class="sect"><h4>${it.files.length} ${it.files.length === 1 ? 'file' : 'tracks'}</h4><div class="filelist">${it.files.map((f, i) => `<div class="frow"><span class="sub" style="width:28px">${i + 1}</span>
    <span class="nm">${esc(f.name)}</span>${f.source === 'torbox' ? '<span class="src tb">TorBox</span>' : ''}<button class="btn small" data-tr="${i}">${svg(ICON.play, 13)}</button></div>`).join('')}</div></div>` + reclassifyHtml(it);
  B.querySelectorAll('[data-tr]').forEach(b => b.onclick = () => abLoad(it, +b.dataset.tr, 0));
  wireReclass(it);
}

function detailGame(it, A, B) {
  const conf = cfg.categories.games;
  const btns = [];
  if (it.installed || it.source === 'psplus') btns.push(`<button class="btn primary" id="gPlay">${svg(ICON.play, 16)} ${it.source === 'psplus' ? 'Open PS Plus' : 'Play'}</button>`);
  if (it.source === 'gamepass' && it.gamepass.pc && !it.installed) btns.push(`<button class="btn ${it.gamepass.cloud ? '' : 'primary'}" id="gXbox">${svg(ICON.dl, 16)} Install in Xbox app</button>`);
  if (it.cloudUrl) btns.push(`<button class="btn ${it.installed ? '' : 'primary'}" id="gCloud">${svg(ICON.cloud, 16)} Play in Cloud</button>`);
  if (it.source === 'torbox') btns.push(`<button class="btn primary" id="gTb">${svg(ICON.dl, 16)} Download from TorBox</button>`);
  if (it.storeUrl) btns.push(`<button class="btn ghost" data-url="${esc(it.storeUrl)}">${svg(ICON.ext, 15)} Store page</button>`);
  if (it.installDir) btns.push(`<button class="btn ghost" id="gDir">${svg(ICON.folder, 15)} ${it.source === 'emulator' ? 'ROM folder' : 'Install folder'}</button>`);
  A.innerHTML = btns.join('');
  const L = l => doPlay({ action: 'game', launch: l }, it);

function launchPs(it) {

/* ============================== audio player (audiobooks + music) ============================== */
const ab = { it: null, track: 0, timer: null, order: [], qi: 0, shuffle: false };
const audio = $('#abAudio');
const shuffled = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
async function abLoad(it, track, pos = 0, order) {
  const isMusic = it.cat === 'music';
  ab.it = it; ab.track = track;
  ab.order = order || (ab.it === it && ab.order.length === it.files.length ? ab.order : it.files.map((_, i) => i));
  ab.qi = Math.max(0, ab.order.indexOf(track));
  const f = it.files[track];
  let src;
  try { src = f.source === 'torbox' ? await window.api.torboxLink(f.tb) : fileUrl(f.path); }
  catch (e) { toast('Could not get stream: ' + e.message, 'bad'); return; }
  if (src && src.ok === false) { toast(src.error, 'bad'); return; }
  audio.src = src;
  audio.playbackRate = isMusic ? 1 : +$('#abRate').value;
  audio.onloadedmetadata = () => { if (pos) audio.currentTime = Math.min(pos, audio.duration - 2); audio.play(); };
  $('#ab').classList.toggle('music', isMusic);
  $('#ab').style.setProperty('--pc', `var(--c-${it.cat})`);
  $('#abImg').src = it.poster || '';
  const n = it.files.length;
  if (isMusic) {
    $('#abTitle').textContent = f.title || f.name;
    $('#abSub').textContent = [f.artist || it.artist, it.title, n > 1 ? `${ab.qi + 1} of ${n}` : ''].filter(Boolean).join(' · ');
  } else {
    $('#abTitle').textContent = it.title;
    $('#abSub').textContent = (it.author ? it.author + ' · ' : '') + (n > 1 ? `Track ${track + 1} of ${n}` : '');
  }
  $('#abShuf').classList.toggle('on', ab.shuffle);
  $('#ab').classList.add('on'); $('#main').classList.add('abon'); document.body.classList.add('abon');
  document.querySelectorAll('[data-playing]').forEach(r => r.classList.toggle('now', r.dataset.playing === it.id + ':' + track));
  window.api.markPlayed(it.id).then(s => ust = s);
}
function abNext() { if (ab.it && ab.qi < ab.order.length - 1) abLoad(ab.it, ab.order[ab.qi + 1], 0, ab.order); }
function abPrev() { if (audio.currentTime > 5 || ab.qi === 0) audio.currentTime = 0; else abLoad(ab.it, ab.order[ab.qi - 1], 0, ab.order); }
function abSave() {
  if (!ab.it || ab.it.cat !== 'audiobooks' || !audio.duration) return;
  const totalTracks = ab.it.files.length;
  const pct = (ab.track + audio.currentTime / audio.duration) / totalTracks;
  const data = { track: ab.track, pos: audio.currentTime, pct };
  ust.progress[ab.it.id] = data; window.api.saveProgress(ab.it.id, data);
}
function abIcon() { $('#abPlay').innerHTML = svg(audio.paused ? ICON.play : ICON.pause); }
audio.addEventListener('play', () => { abIcon(); clearInterval(ab.timer); ab.timer = setInterval(abSave, 10000); });
audio.addEventListener('pause', () => { abIcon(); abSave(); clearInterval(ab.timer); });
audio.addEventListener('timeupdate', () => { $('#abCur').textContent = fmtTime(audio.currentTime); $('#abDur').textContent = fmtTime(audio.duration); if (audio.duration) $('#abSeek').value = audio.currentTime / audio.duration * 1000; });
audio.addEventListener('ended', () => { if (ab.it && ab.qi < ab.order.length - 1) abNext(); else abSave(); });
audio.addEventListener('error', () => { if (audio.src) toast('This audio file could not be played', 'bad'); });
$('#abPlay').onclick = () => audio.paused ? audio.play() : audio.pause();
$('#abBack').onclick = () => audio.currentTime -= 30;
$('#abFwd').onclick = () => audio.currentTime += 30;
$('#abPrev').onclick = abPrev;
$('#abNext').onclick = abNext;
$('#abShuf').onclick = () => {
  ab.shuffle = !ab.shuffle; $('#abShuf').classList.toggle('on', ab.shuffle);
  if (!ab.it) return;
  const cur = ab.track, rest = ab.it.files.map((_, i) => i).filter(i => i !== cur);
  ab.order = [cur, ...(ab.shuffle ? shuffled(rest) : rest.sort((a, b) => a - b))]; ab.qi = 0;
  if (!ab.shuffle) { ab.order = ab.it.files.map((_, i) => i); ab.qi = cur; }
};
$('#abSeek').oninput = e => { if (audio.duration) audio.currentTime = e.target.value / 1000 * audio.duration; };
$('#abRate').onchange = e => audio.playbackRate = +e.target.value;
$('#abClose').onclick = () => { abSave(); audio.pause(); $('#ab').classList.remove('on'); $('#main').classList.remove('abon'); document.body.classList.remove('abon'); };
abIcon();

const SETUP_TABS = [['general', 'General', 'setup'], ...CATS.map(c => [c.id, c.label, c.id])];
function renderSetup() {
  if (!ui.draft) ui.draft = JSON.parse(JSON.stringify(cfg));

  let html = `<div class="setup"><h1 class="cat">Library Setup</h1><div class="sub">Folders, streaming services, scrapers, TorBox and game platforms — per category.</div>`;
  if (!cfg.setupDone) html += `<div class="welcome"><b>Welcome to Argus Launcher.</b><br>Start on <i>General</i> with your API keys (TMDB for movie/TV metadata, TorBox if you use it), then go tab by tab. Hit <b>Save &amp; Scan</b> when you're done — you can come back any time.</div>`;
  html += `<div class="tabs">${SETUP_TABS.map(([id, l, c]) => `<button data-tab="${id}" class="${ui.setupTab === id ? 'on' : ''}" style="--tc:var(--c-${c})">${l}</button>`).join('')}</div><div id="setupBody" style="--tc:var(--c-${ui.setupTab === 'general' ? 'setup' : ui.setupTab})"></div>

  $('#view').innerHTML = html;
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { ui.setupTab = b.dataset.tab; renderSetup(); });
  $('#sCancel').onclick = () => { ui.draft = null; renderSetup(); toast('Changes discarded'); };
  $('#sSave').onclick = () => saveSetup(false);

async function saveSetup(scan) {

}
const tog = (key, label, on, help = '', dis = false) => `<label class="tog ${dis ? 'dis' : ''}" tabindex="0"><input type="checkbox" data-k="${key}" ${on ? 'checked' : ''}><span class="sw"></span><span>${label}${help ? `<small>${help}</small>` : ''}</span></label>`;
function setPath(obj, keyPath, val) { const ks = keyPath.split('.'); let o = obj; while (ks.length > 1) o = o[ks.shift()]; o[ks[0]] = val; }
function getPath(obj, keyPath) { return keyPath.split('.').reduce((o, k) => o && o[k], obj); }
function wireToggles(root, d, after) {
  root.querySelectorAll('input[data-k]').forEach(i => i.onchange = () => { setPath(d, i.dataset.k, i.type === 'checkbox' ? i.checked : i.value); if (after) after(i.dataset.k); });
}

function wireEmulation(body, g, redraw) {
  const e = g.emulation;
  if (e.enabled && e.retroarchPath && ui.emuCoresFor !== e.retroarchPath) {
    ui.emuCoresFor = e.retroarchPath;
    window.api.emuCores(e.retroarchPath).then(c => { ui.emuCores = c || []; redraw(); });
  }
  const addSystem = (id, folder) => {
    const sys = sysOf(id);
    let c = e.systems.find(x => x.id === id);
    if (!c) { c = { id, folders: [], emulator: sys.preferStandalone ? 'custom' : 'retroarch', core: '', customExe: '', customArgs: sys.standalone && sys.standalone[0] ? sys.standalone[0].args : '"{rom}"' }; e.systems.push(c); }
    if (folder && !c.folders.includes(folder)) c.folders.push(folder);
  };
  const findEmus = async (quiet) => {
    if (!quiet) toast('Searching for emulators (this can take a moment on network drives)…');
    const r = await window.api.emuDetect(JSON.parse(JSON.stringify(e)));
    if (!r || r.ok === false) { toast('Search failed: ' + ((r && r.error) || 'unknown error'), 'bad'); return; }
    const found = [];
    if (r.retroarch && r.retroarch !== e.retroarchPath) { e.retroarchPath = r.retroarch; ui.emuCores = r.cores; ui.emuCoresFor = r.retroarch; found.push(`RetroArch (${r.cores.length} cores)`); }
    for (const c of e.systems) {
      const sa = r.systems && r.systems[c.id];
      if (!sa) continue;
      const useIt = !e.retroarchPath || (sysOf(c.id).preferStandalone && c.emulator !== 'custom') || (c.emulator === 'custom' && !c.customExe);
      if (useIt) { c.emulator = 'custom'; c.customExe = sa.exe; c.customArgs = sa.args; found.push(`${sysOf(c.id).name}: ${sa.exe.split(/[\\/]/).pop()}`); }
    }
    if (found.length) toast('Found ' + found.join(', '), 'ok');
    else if (!quiet) toast(e.retroarchPath ? 'Nothing new found; your setup is unchanged.' : 'No RetroArch or standalone emulators found. Install RetroArch from retroarch.com, or browse to your emulator.', 'bad');
    redraw();
  };
  if ($('#raDet')) $('#raDet').onclick = () => findEmus(false);
  if ($('#raBrowse')) $('#raBrowse').onclick = async () => { const f = await window.api.pickFile([{ name: 'RetroArch', extensions: ['exe'] }]); if (f) { e.retroarchPath = f; ui.emuCoresFor = null; redraw(); } };
  if ($('#emuAddRoot')) $('#emuAddRoot').onclick = async () => {
    const picked = await window.api.pickFolders(); let n = 0; const miss = [];
    for (const root of picked) { const found = await window.api.emuAutoAssign(root); if (found.length) found.forEach(f => { addSystem(f.id, f.folder); n++; }); else miss.push(root); }
    if (n) toast(`Matched ${n} system folder${n > 1 ? 's' : ''}`, 'ok');
    if (n && !e.retroarchPath) setTimeout(() => findEmus(true), 50);
    if (miss.length) { ui.emuPending = miss; toast("Couldn't tell which system " + (miss.length > 1 ? 'some folders are' : 'that folder is') + ' — use "add a system manually", then + Folder', 'bad'); }
    redraw();
  };
  if ($('#emuAddSys')) $('#emuAddSys').onchange = ev => { if (!ev.target.value) return; addSystem(ev.target.value, (ui.emuPending || []).shift()); redraw(); };
  body.querySelectorAll('[data-emurm]').forEach(b => b.onclick = () => { e.systems.splice(+b.dataset.emurm, 1); redraw(); });
  body.querySelectorAll('[data-emurmf]').forEach(b => b.onclick = () => { const [i, j] = b.dataset.emurmf.split(':').map(Number); e.systems[i].folders.splice(j, 1); redraw(); });
  body.querySelectorAll('[data-emuaddf]').forEach(b => b.onclick = async () => { const c = e.systems[+b.dataset.emuaddf]; for (const f of await window.api.pickFolders()) if (!c.folders.includes(f)) c.folders.push(f); redraw(); });
  body.querySelectorAll('[data-emusel]').forEach(sel => sel.onchange = () => { const c = e.systems[+sel.dataset.emusel]; if (sel.value === 'custom') c.emulator = 'custom'; else { c.emulator = 'retroarch'; c.core = sel.value.slice(3); } redraw(); });
  body.querySelectorAll('[data-emuexe]').forEach(i => i.oninput = () => { e.systems[+i.dataset.emuexe].customExe = i.value.trim(); });
  body.querySelectorAll('[data-emuargs]').forEach(i => i.oninput = () => { e.systems[+i.dataset.emuargs].customArgs = i.value; });
  body.querySelectorAll('[data-emubrowse]').forEach(b => b.onclick = async () => { const f = await window.api.pickFile([{ name: 'Emulator', extensions: ['exe'] }]); if (f) { e.systems[+b.dataset.emubrowse].customExe = f; redraw(); } });
  body.querySelectorAll('[data-emupreset]').forEach(b => b.onclick = () => { e.systems[+b.dataset.emupreset].customArgs = b.dataset.args; redraw(); });
}

/* ============================== updates ============================== */
let updState = null;
function updText(u) {
  if (!u) return '';
  const v = 'Argus Launcher ' + u.current;
  if (!u.installed) return `${v} (portable). Automatic updates work in the installed version; get the latest setup from github.com/MagnusPerditor/argus-launcher/releases.`;
  return v + ' · ' + ({ idle: 'Waiting to check', checking: 'Checking for updates…', current: 'You’re up to date', available: `Version ${u.version} is available`, downloading: `Downloading ${u.version || 'update'}… ${u.percent || 0}%`, ready: `Version ${u.version} is ready to install`, error: 'Update check failed: ' + (u.error || 'unknown error') }[u.state] || u.state);
}
function paintUpdates() {
  const u = updState;
  const b = $('#updBtn');
  if (b) { if (u && u.state === 'ready') { b.style.display = ''; b.textContent = `↻ Restart to update (${u.version})`; b.onclick = () => window.api.updateInstall(); } else b.style.display = 'none'; }
  if ($('#updLine')) {
    $('#updLine').textContent = updText(u);
    $('#updNow').style.display = u && u.state === 'ready' ? '' : 'none';
    $('#updDl').style.display = u && u.state === 'available' ? '' : 'none';
    $('#updCheck').disabled = !u || !u.installed || u.state === 'checking' || u.state === 'downloading';
  }
}
function wireUpdates() {
  if (!window.api.updateInfo) return;
  window.api.updateInfo().then(u => { updState = u; paintUpdates(); });
  $('#updCheck').onclick = () => window.api.updateCheck().then(r => r && r.ok === false && toast(r.error, 'bad'));
  $('#updNow').onclick = () => window.api.updateInstall();
  $('#updDl').onclick = () => window.api.updateDownload();
}
if (window.api && window.api.onUpdate) window.api.onUpdate(u => {
  const was = updState && updState.state;
  updState = u; paintUpdates();
  if (u.state === 'ready' && was !== 'ready') toast(`Argus Launcher ${u.version} is ready. Restart to update.`, 'ok');
});

/* ============================== live watch progress ============================== */
if (window.api && window.api.onWatch) window.api.onWatch(u => {
  const was = ust.progress[u.key];
  ust.progress[u.key] = u.data;

async function rescan(only) {
  if (ui.scanning) return;
  ui.scanning = true; renderNav();
  $('#scanStatus').innerHTML = 'Starting scan…<div class="bar"><i></i></div>';
  try { lib = await window.api.rescan(only); }
  catch (e) { toast('Scan failed: ' + e.message, 'bad'); }
  ui.scanning = false;
  const n = CATS.reduce((s, c) => s + itemsOf(c.id).length, 0);
  $('#scanStatus').textContent = `${n} items · ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;

}
window.api && window.api.onProgress(p => {
  if (p.cat === 'done') { $('#scanStatus').textContent = 'Library updated · ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); return; }
  const pct = p.total ? Math.round(p.done / p.total * 100) : 15;
  $('#scanStatus').innerHTML = `${esc(CAT[p.cat] ? CAT[p.cat].label + ': ' : '')}${esc(p.msg)}${p.total ? ` ${p.done}/${p.total}` : ''}<div class="bar"><i style="width:${pct}%"></i></div>`;
});

/* ============================== controller / couch mode ============================== */
const NAV_SEL = 'button:not([disabled]), .card, .tile, input:not([type=hidden]):not([type=checkbox]), select, label.tog:not(.dis), [data-tr].frow';
const nav = { mode: false, couch: false, held: {}, osk: null, lastFocus: null, autoDone: false };
const shown = e => { const r = e.getBoundingClientRect(); return r.width > 0 && r.height > 0; };
function navRoot() {
  if (nav.osk) return $('#osk');
  if ($('#tmenu').classList.contains('on')) return $('#tmenu');
  if ($('#detail').classList.contains('on')) return $('#detail');
  return document.body;
}
function navCandidates() {
  const root = navRoot();
  let els = [...root.querySelectorAll(NAV_SEL)].filter(shown);
  if (root === document.body) els = els.filter(e => !$('#detail').contains(e) && !$('#osk').contains(e) && !(e.closest('#ab') && !$('#ab').classList.contains('on')));
  return els.filter(e => !e.closest('.card') || e.classList.contains('card')); // a card is one stop
}
function focusEl(e) {

  e.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
}
function defaultFocus() {
  const root = navRoot();
