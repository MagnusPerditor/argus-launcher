# Builds the Windows installer and publishes it as a GitHub Release.
# Triggered by pushing a version tag (git tag v1.2.0 && git push origin v1.2.0), or run it by hand from
# the Actions tab (Release -> Run workflow): it then tags the current package.json version itself.
# The tag must match "version" in package.json. Installed copies of Argus Launcher
# pick the new release up automatically (electron-updater reads latest.yml from the release).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install mutagen
      - run: npm ci
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version $PKG"; exit 1
          fi

      - run: npm ci

      - name: Create version tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null; then
            echo "Tag $TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" && git push origin "$TAG"
          fi

      # Create ONE draft release up front so electron-builder's parallel uploads all land in it
      # (otherwise each upload can race to create its own release with the same tag).
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="$(node -p "require('./package.json').version")"
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "Release v$VER already exists"
          else
            gh release create "v$VER" --draft --title "$VER" --notes "Argus Launcher $VER" --target "$GITHUB_SHA"
          fi

      - name: Build installer and upload to the draft
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="$(node -p "require('./package.json').version")"
          gh release edit "v$VER" --draft=false --latest
          gh release view "v$VER" --json assets --jq '.assets[].name'
